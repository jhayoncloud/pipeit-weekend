1. Open .github/workflows/ci.yml and click the pencil (Edit)

2. Replace everything with this (change "Your Name" to your real name):

name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get my code
        uses: actions/checkout@v7

      - name: Run my checks
        run: bash tests/check.sh

      - name: Try my own action
        uses: ./.github/actions/build-card
        with:
          name: John Essien
